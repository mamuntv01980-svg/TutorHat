<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TutorHat – Find Trusted Tutors & Tuition Jobs in Bangladesh</title>
    <meta name="description" content="TutorHat connects students and guardians with tutors for school, college, university, Quran, Arabic and more across Bangladesh." />
    <meta property="og:title" content="TutorHat – Find Trusted Tutors & Tuition Jobs in Bangladesh" />
    <meta property="og:description" content="TutorHat connects students and guardians with tutors for school, college, university, Quran, Arabic and more across Bangladesh." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta id="app-title-meta" name="apple-mobile-web-app-title" content="TutorHat" />
    <link id="app-icon" rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link id="app-apple-icon" rel="apple-touch-icon" href="/icon.svg" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase();
          var h = window.location.hash.toLowerCase();
          if (p === '/admin' || p.startsWith('/admin/') || h === '#admin') {
            var m = document.getElementById('app-manifest');
            if (m) m.setAttribute('href', '/manifest-admin.json');
            var icon = document.getElementById('app-icon');
            if (icon) icon.setAttribute('href', '/icon-admin.svg');
            var appleIcon = document.getElementById('app-apple-icon');
            if (appleIcon) appleIcon.setAttribute('href', '/icon-admin.svg');
            var appTitle = document.getElementById('app-title-meta');
            if (appTitle) appTitle.setAttribute('content', 'TutorHat Admin');
            document.title = 'TutorHat Admin – Management Console';
          }
        } catch(e) {}
        
        // Prevent service worker from interfering with Vite dev preview
        if ('serviceWorker' in navigator) {
          var isDevOrPreview = window.location.hostname === 'localhost' || 
                               window.location.hostname === '127.0.0.1' || 
                               window.location.hostname.indexOf('run.app') !== -1;
          if (isDevOrPreview) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
            if (window.caches) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) {
                  caches.delete(keys[j]);
                }
              }).catch(function() {});
            }
          } else {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
